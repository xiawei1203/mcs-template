version: "3"
services:
  mcscloud-template:
    build:
      dockerfile: Dockerfile
      context: ./
    image: mcscloud/template
    container_name: mcscloud-template
    ports:
      - 30060:30060
    # application.yml 中的值为开发环境默认值，线上环境统一在此覆盖
    environment:
      - spring.application.name=template
      - server.port=30060
      # Nacos 注册中心：ip 为宿主机对外 IP，group/namespace 需与目标环境一致
      - spring.cloud.nacos.discovery.server-addr=192.168.0.150:8850
      - spring.cloud.nacos.discovery.ip=192.168.0.198
      - spring.cloud.nacos.discovery.namespace=51d96b41-9a2f-41a0-8b4b-c0d765feffc4
      - spring.cloud.nacos.discovery.group=MCS_CLOUD
      # 数据源：本项目使用 dynamic-datasource，必须走 spring.datasource.dynamic.datasource.{名称}.* 路径。
      # 写成 spring.datasource.druid.url 不会生效，应用会连回 application.yml 中的开发库。
      - spring.datasource.dynamic.datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver
      - spring.datasource.dynamic.datasource.master.url=jdbc:mysql://192.168.0.150:13306/mcscloud_template?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.dynamic.datasource.master.username=root
      - spring.datasource.dynamic.datasource.master.password=root
      # 启用了 TDengine slave 数据源时一并覆盖
      #- spring.datasource.dynamic.datasource.slave.driver-class-name=com.taosdata.jdbc.rs.RestfulDriver
      #- spring.datasource.dynamic.datasource.slave.url=jdbc:TAOS-RS://192.168.0.150:6041/mcsgiscloud?timezone=Asia/Shanghai&charset=UTF-8
      #- spring.datasource.dynamic.datasource.slave.username=root
      #- spring.datasource.dynamic.datasource.slave.password=taosdata
      - spring.redis.host=192.168.0.150
      - spring.redis.port=6379
      - spring.redis.database=4
      # 认证中心 JWK 地址
      - mcs.security.jwk-set-uri=http://192.168.0.198:9002/oauth2/jwks
      # 生产环境关闭 SQL 全量打印，避免日志膨胀
      - mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
    volumes:
      - /usr/local/mcs/logs:/usr/local/mcs/logs
